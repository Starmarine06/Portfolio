<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" role="img" aria-label="Chamber Draw">
  <defs>
    <linearGradient id="cdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd45e" />
      <stop offset="100%" stop-color="#d99a1f" />
    </linearGradient>
  </defs>

  <!-- Gold squircle card, matches the on-page brand lockup -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#cdGold)" />
  <rect x="3" y="3" width="122" height="122" rx="26" fill="none" stroke="#0d1322" stroke-opacity="0.18" stroke-width="6" />

  <!-- Chamber bolt: an open ring with a live round -->
  <circle cx="64" cy="38.4" r="19.8" fill="none" stroke="#0d1322" stroke-width="11.5" />
  <circle cx="64" cy="38.4" r="6.1" fill="#0d1322" />

  <text x="64" y="102"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="51" font-weight="800" letter-spacing="1"
        text-anchor="middle" fill="#0d1322">CD</text>
</svg>
