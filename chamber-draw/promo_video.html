<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamber Draw — Promotional Video</title>
<style>
  :root {
    --red: #e02929;
    --blue: #2e6be0;
    --green: #26ae4d;
    --yellow: #f2c719;
    --purple: #b847e6;
    --orange: #f9801e;
    --cyan: #19c5e6;
    --pink: #ed6bb8;
    --gold: #ffd45e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #07090f;
    color: #e8ecf5;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #stage {
    position: relative;
    width: min(100vw, 160vh, 1080px);
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.06);
    background:
      radial-gradient(ellipse at 50% 115%, rgba(30,60,45,0.9) 0%, rgba(10,16,28,0) 58%),
      radial-gradient(ellipse at 50% 0%, #182036 0%, #0d1322 48%, #07090f 100%);
    background-color: #07090f;
  }

  /* animated nebula star field */
  #stars { position: absolute; inset: 0; }
  .star {
    position: absolute;
    background: #cdd7ff;
    border-radius: 50%;
    animation: twinkle var(--t) ease-in-out var(--d) infinite;
    opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50% { opacity: 0.9; transform: scale(1); }
  }

  /* flying cards */
  .card {
    position: absolute;
    width: 52px; height: 78px;
    border-radius: 8px;
    left: 50%; top: 28%;
    margin-left: -26px; margin-top: -39px;
    animation: fly 9s linear var(--d) infinite;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  @keyframes fly {
    0%   { opacity: 0; visibility: visible; transform: translate(0,0) rotate(0deg) scale(0.55); }
    4%   { opacity: 1; }
    22%  { opacity: 1; transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.95); }
    32%  { opacity: 1; transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.95); }
    36%  { opacity: 0; visibility: hidden; transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.8); }
    100% { opacity: 0; visibility: hidden; }
  }

  /* game title */
  #title {
    position: absolute;
    left: 0; right: 0;
    top: 45%;
    transform: translateY(-50%);
    text-align: center;
    z-index: 5;
    animation: titleIn 8s ease-out infinite;
  }
  #title h1 {
    font-size: clamp(40px, 10vw, 118px);
    font-weight: 900;
    letter-spacing: 0.04em;
    background: linear-gradient(180deg, #ffffff 0%, var(--gold) 65%, #d99a1f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 18px rgba(255, 212, 94, 0.35));
  }
  #title .sub {
    margin-top: 10px;
    font-size: clamp(13px, 2.6vw, 26px);
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #9fb0d0;
  }
  @keyframes titleIn {
    0%, 2%   { opacity: 0; transform: translateY(-50%) scale(1.12); }
    7%, 60%  { opacity: 1; transform: translateY(-50%) scale(1); }
    75%, 100%{ opacity: 0; transform: translateY(-50%) scale(0.96); }
  }

  /* feature bullets carousel */
  #bullets {
    position: absolute;
    left: 0; right: 0;
    bottom: 13%;
    text-align: center;
    z-index: 5;
  }
  #bullets .lead {
    font-size: clamp(15px, 3vw, 28px);
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,0.6);
  }
  #bullets .lead b { color: var(--gold); }

  .slide {
    opacity: 0;
    animation: slide-show 16s step-end infinite;
  }
  .slide:nth-child(1) { animation-delay: 0s; }
  .slide:nth-child(2) { animation-delay: 4s; }
  .slide:nth-child(3) { animation-delay: 8s; }
  .slide:nth-child(4) { animation-delay: 12s; }
  @keyframes slide-show {
    0%   { opacity: 1; }
    23%  { opacity: 1; }
    25%  { opacity: 0; }
    100% { opacity: 0; }
  }

  /* bottom color bar */
  #seatbar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    height: 7px;
    z-index: 6;
  }
  #seatbar span { flex: 1; animation: pulse 2.4s ease-in-out infinite; }
  #seatbar span:nth-child(1) { background: var(--red); }
  #seatbar span:nth-child(2) { background: var(--blue); animation-delay: 0.2s; }
  #seatbar span:nth-child(3) { background: var(--green); animation-delay: 0.4s; }
  #seatbar span:nth-child(4) { background: var(--yellow); animation-delay: 0.6s; }
  #seatbar span:nth-child(5) { background: var(--purple); animation-delay: 0.8s; }
  #seatbar span:nth-child(6) { background: var(--orange); animation-delay: 1.0s; }
  #seatbar span:nth-child(7) { background: var(--cyan); animation-delay: 1.2s; }
  #seatbar span:nth-child(8) { background: var(--pink); animation-delay: 1.4s; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* LIVE badge */
  #live {
    position: absolute;
    top: 14px; left: 14px;
    z-index: 7;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: #fff;
    background: var(--red);
    padding: 5px 12px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 3px 12px rgba(224,41,41,0.4);
  }
  #live .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fff;
    animation: blink 1.1s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  #hint {
    position: absolute;
    bottom: 46px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #6b7a99;
    font-weight: 600;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Chamber Draw promotional animation">

  <div id="stars" aria-hidden="true">
    <div class="star" style="left:6%;top:12%;--t:3s;--d:0s;"          ></div>
    <div class="star" style="left:15%;top:28%;--t:2.4s;--d:0.6s;"      ></div>
    <div class="star" style="left:23%;top:9%;--t:3.4s;--d:1.2s;"       ></div>
    <div class="star" style="left:33%;top:22%;--t:2.8s;--d:0.9s;"      ></div>
    <div class="star" style="left:42%;top:7%;--t:3.1s;--d:0.3s;"       ></div>
    <div class="star" style="left:52%;top:18%;--t:2.6s;--d:1.5s;"      ></div>
    <div class="star" style="left:61%;top:11%;--t:3.7s;--d:0.4s;"      ></div>
    <div class="star" style="left:70%;top:26%;--t:2.9s;--d:1.1s;"      ></div>
    <div class="star" style="left:78%;top:8%;--t:3.2s;--d:0.7s;"       ></div>
    <div class="star" style="left:86%;top:20%;--t:2.5s;--d:1.4s;"      ></div>
    <div class="star" style="left:92%;top:14%;--t:3.6s;--d:0.2s;"      ></div>
    <div class="star" style="left:11%;top:55%;--t:2.7s;--d:1.8s;"      ></div>
    <div class="star" style="left:29%;top:47%;--t:3.3s;--d:0.5s;"      ></div>
    <div class="star" style="left:48%;top:60%;--t:2.3s;--d:2.0s;"      ></div>
    <div class="star" style="left:66%;top:52%;--t:3.0s;--d:0.8s;"      ></div>
    <div class="star" style="left:84%;top:46%;--t:2.6s;--d:1.6s;"      ></div>
    <div class="star" style="left:95%;top:58%;--t:3.5s;--d:0.1s;"      ></div>
  </div>

  <!-- flying card backs: each animation shoots from deck to a seat -->
  <div class="card" style="background:#202838;border:3px solid #3a4c6e;--d:0.2s;--tx:60px;--ty:38px;--rot:22deg;"></div>
  <div class="card" style="background:#27344f;border:3px solid #3a4c6e;--d:0.55s;--tx:-90px;--ty:46px;--rot:-18deg;"></div>
  <div class="card" style="background:#202838;border:3px solid #3a4c6e;--d:0.9s;--tx:150px;--ty:-4px;--rot:12deg;"></div>
  <div class="card" style="background:#27344f;border:3px solid #3a4c6e;--d:1.25s;--tx:-175px;--ty:20px;--rot:-28deg;"></div>
  <div class="card" style="background:#202838;border:3px solid #3a4c6e;--d:1.6s;--tx:215px;--ty:52px;--rot:34deg;"></div>
  <div class="card" style="background:#27344f;border:3px solid #3a4c6e;--d:1.95s;--tx:-235px;--ty:64px;--rot:-36deg;"></div>
  <div class="card" style="background:#202838;border:3px solid #3a4c6e;--d:2.3s;--tx:270px;--ty:30px;--rot:20deg;"></div>
  <div class="card" style="background:#27344f;border:3px solid #3a4c6e;--d:2.65s;--tx:-300px;--ty:74px;--rot:-14deg;"></div>

  <div id="title">
    <h1>CHAMBER<br>DRAW</h1>
    <div class="sub">Shedding Race · 2–7 Players</div>
  </div>

  <div id="bullets">
    <div class="slide lead">Be the first to run out of cards <b>&amp; win</b></div>
    <div class="slide lead">Beware the <b>Chamber</b> — bombs hide in both decks</div>
    <div class="slide lead">Diffuse strikes, stack <b>+N Draws</b>, jump in out of turn</div>
    <div class="slide lead">Play <b>offline vs AI</b> or <b>online</b> with Epic Friends</div>
  </div>

  <div id="seatbar">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <div id="live"><span class="dot"></span>PROMO</div>
  <div id="hint">2–7 players · Epic Online Services · Free</div>
</div>
</body>
</html>
